
apiVersion: apps/v1
kind: Deployment

metadata:
  name: estateiq-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: estateiq

  template:
    metadata:
      labels:
        app: estateiq

    spec:
      containers:
        - name: estateiq
          image: estateiq:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
